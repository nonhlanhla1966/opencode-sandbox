name: appfactory-build

on:
  push:
    branches: [main]
    paths: ['apps/**', 'scripts/**', 'tools/fastlane/**', 'modules/**', 'modules/DEPENDENCY_REGISTRY.json', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      app:
        description: 'Single app slug to build (blank = all)'
        required: false
        type: string
      cold:
        description: 'Cold-cache benchmark run (wipe the Gradle cache first)'
        required: false
        type: boolean

concurrency:
  group: appfactory-build
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
  FL_CONFIG_CACHE: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare cold-cache benchmark
        if: inputs.cold
        run: |
          rm -rf "$GRADLE_USER_HOME"
          echo "cold-cache benchmark: wiped \$GRADLE_USER_HOME so this run builds from empty caches"

      - name: Collect app directories
        id: apps
        run: |
          if [ -n "${{ inputs.app }}" ]; then
            APPS="${{ inputs.app }}"
          else
            APPS=""
            for d in apps/*/; do
              [ -f "$d/build.gradle" ] && APPS="$APPS $(basename "$d")"
            done
          fi
          APPS="$(echo $APPS | xargs -n1 | sort -u | xargs)"
          echo "apps=[$APPS]"
          echo "APPS=$APPS" >> "$GITHUB_ENV"

      - name: Fast Lane engine selftest (no SDK needed)
        run: |
          bash tools/fastlane/selftest.sh

      - name: Assistant layer selftest (deterministic, no SDK/network needed)
        run: |
          python3 tools/assistant/assistantselftest.py

      - name: Fast Lane build (estimate + compile + tests + gates + security + verify)
        env:
          FL_COLD_CACHE: ${{ inputs.cold && '1' || '0' }}
        run: |
          bash tools/fastlane/build-all.sh --apps "$APPS" -j 2

      - name: Publish Releases (rolling app-<slug>-latest)
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rows_file="$(mktemp)"
          for app in $APPS; do
            apk="$(bash scripts/find-apk.sh "apps/$app")"
            issue=$(python3 -c "import json;print(json.load(open('apps/$app/release.json')).get('issue') or 0)" 2>/dev/null || echo 0)
            if [ -n "$apk" ] && [ -f "$apk" ]; then
              echo "== RELEASE $app (issue=${issue:-0})"
              url=$(bash scripts/release.sh "apps/$app" | sed -n 's/^release-url=//p')
              echo "== RELEASED $app -> $url"
            else
              url=""
              echo "== NO APK for $app"
            fi
            echo "$app|$issue|$url" >> "$rows_file"
          done
          {
            echo "release_rows<<APPFACTORY_EOF"
            cat "$rows_file"
            echo "APPFACTORY_EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f "$rows_file"

      - name: Persist Fast Lane telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-benchmark-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            .fastlane/telemetry.json
            .fastlane/tmp/runs.jsonl
            .fastlane/tmp/accuracy-*.json
            .fastlane/tmp/benchmark-*.json

      - name: Post DOWNLOAD_READY on requesting issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROWS: ${{ steps.publish.outputs.release_rows }}
        run: |
          ROWS="${ROWS:-}"
          if [ -z "$ROWS" ]; then echo "no release rows"; exit 0; fi
          while IFS='|' read -r app issue url; do
            [ -n "$app" ] || continue
            if [ "${issue:-0}" -gt 0 ] 2>/dev/null; then
              if [ -n "$url" ]; then
                msg="DOWNLOAD_READY — **$app** is built, verified and released. Direct APK download: $url (SHA-256 checksum in the release)."
              else
                msg="BUILD_FAILED — **$app** did not produce a verified APK this run."
              fi
              bash scripts/note.sh "$issue" "$msg" || true
            else
              echo "no requesting issue for $app (skip comment)"
            fi
          done <<< "$ROWS"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## AppFactory build result"
            echo ""
            for app in $APPS; do
              apk="$(bash scripts/find-apk.sh "apps/$app")"
              if [ -n "$apk" ] && [ -f "$apk" ]; then
                sz=$(du -h "$apk" | cut -f1)
                apk_name="$(basename "$apk")"
                sha=$(sha256sum "$apk" | awk '{print $1}')
                echo "- **$app**: APK OK ($sz) sha256:\`${sha:0:12}…\` — release: https://github.com/${{ github.repository }}/releases/download/app-$app-latest/$apk_name"
              else
                echo "- **$app**: NO APK"
              fi
            done
            echo ""
            echo "## Fast Lane 3.0"
            acc="$(python3 tools/fastlane/accuracy.py score-all apps 2>/dev/null || echo '{}')"
            echo '```json'
            printf '%s\n' "$acc" | python3 -c 'import json,sys; d=json.load(sys.stdin); [print("{:<32} accuracy={}/100".format(a.get("app"), a.get("accuracy_score"))) for a in d.get("apps",[])]' || echo "no accuracy data"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"