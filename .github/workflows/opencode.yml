name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      (contains(github.event.comment.body, '/app') ||
       contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    concurrency:
      group: appfactory-engine
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      id-token: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          mentions: "/app, /oc, /opencode"
          prompt: |
            You are the Android AppFactory engine. A human issued a one-line
            app request with /app (or /oc, /opencode) on this issue.

            Execute the FULL procedure in AGENTS.md at the repository root,
            exactly: DESIGN first (DESIGN.md with screens, navigation, visual
            style, interactions, app-icon concept), then CODE a real,
            lightweight, buildable Android Gradle APK under apps/<slug>,
            TEST with ./gradlew --no-daemon testDebugUnitTest, LOCAL_VALIDATION
            with bash scripts/validate-app.sh apps/<slug>, WRITE release.json
            with the issue number and request, then commit and push to main.

            AFTER pushing, trigger CI explicitly (GITHUB_TOKEN pushes do NOT
            fire the push-triggered build workflow):
            gh workflow run appfactory-build.yml --repo ${GITHUB_REPOSITORY} \
              --ref main -f app=<slug>
            then confirm with gh run list --workflow=appfactory-build.yml.
            Do not create the GitHub Release yourself.

            Rules: never expose secrets; do NOT create hand-made branches or
            Releases (CI does that); repair failures and retry up to 3 times;
            push through git using the provided GITHUB_TOKEN. End
            with a concise completion comment naming the app and confirming CI
            will publish the APK download link here.