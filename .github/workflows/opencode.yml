name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      (contains(github.event.comment.body, '/app') ||
       contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    concurrency:
      group: appfactory-engine
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      id-token: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          mentions: "/app, /oc, /opencode"
          prompt: |
            You are the OpenCode AppFactory — Fast Lane engine. A human issued
            a one-line app request with /app (or /oc, /opencode) on this issue.

            Follow AGENTS.md and drive every step through the deterministic
            Fast Lane CLIs; never hand-write specs or scaffold by hand:

            1. ANALYZE — run the App Idea Analyzer:
                 python3 tools/fastlane/analyze.py "<request text>" > apps/.idea.json
               (deterministic: features, screens, permissions, APIs, modules,
               complexity, build-time estimate).
            2. PLAN — python3 tools/fastlane/plan.py apps/.idea.json (writes
               architecture.json + PLAN.md next to it).
            3. SCAFFOLD a real, lightweight, buildable Java Android project:
                 python3 tools/fastlane/scaffold.py apps/.idea.json apps/.architecture.json apps/<slug>
               It vendors verified modules from modules/ as source; never edit
               generated files arbitrarily — enrich mindfully.
            4. TESTGEN — run bash tools/fastlane/testgen.sh apps/<slug> to add
               generated unit tests (never overwrites existing tests).
            5. Write release.json with the requesting issue number, then run
               bash scripts/validate-app.sh apps/<slug> (LOCAL_VALIDATION) and
               commit + push to main.

            AFTER pushing, trigger CI explicitly (GITHUB_TOKEN pushes do NOT
            fire the push-triggered build workflow):
              gh workflow run build.yml --repo ${GITHUB_REPOSITORY} \
                --ref main -f app=<slug>
            then confirm with gh run list --workflow=build.yml.
            Do not create the GitHub Release yourself.

            Rules: never expose secrets; do NOT create hand-made branches or
            Releases (CI does that); use tools/fastlane/repair.sh budgets for
            compile failures (max 3 attempts); never weaken the quality gates
            (tools/fastlane/gates.sh C001-C010) to save time; commit to main.
            End with a concise completion comment naming the app and confirming
            CI will publish the APK download link here.